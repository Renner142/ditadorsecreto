<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo</title>

  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/board.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/effects.css">

</head>
<body>
  <main id="app">
    <section class="screen" id="screen-loading">
      <p data-i18n="common.loading"></p>
    </section>

    <section class="screen" id="screen-error" hidden>
      <p data-i18n="common.error"></p>
    </section>

    <section class="screen" id="screen-home" hidden>
  <h1 data-theme-text="title"></h1>
  <input id="nickname" data-i18n-placeholder="home.nickname" maxlength="16">
  <button id="btn-create" class="btn" data-i18n="home.create"></button>
  <input id="room-code" data-i18n-placeholder="home.code" maxlength="6">
  <button id="btn-join" class="btn" data-i18n="home.join"></button>
  <p id="home-error" class="error"></p>
</section>

<section class="screen" id="screen-lobby" hidden>
  <p class="label" data-i18n="lobby.code_label"></p>
  <p id="lobby-code" class="code-display"></p>
  <h2 data-i18n="lobby.players"></h2>
  <ul id="player-list" class="player-list"></ul>
  <p id="lobby-hint" class="hint"></p>
  <button id="btn-start" class="btn" data-i18n="lobby.start" hidden></button>
  <button id="btn-leave" class="btn btn-secondary" data-i18n="lobby.leave"></button>
</section>

<section class="screen" id="screen-role" hidden>
  <p class="label" data-i18n="role.you_are"></p>
  <button id="btn-peek" class="btn" data-i18n="role.hold"></button>
  <div id="role-content" hidden>
    <h2 id="role-name" class="role-name"></h2>
    <p id="role-party" class="label"></p>
    <ul id="role-known" class="player-list"></ul>
    <p id="role-hint" class="hint"></p>
  </div>
  <p id="role-countdown" class="hint"></p>
</section>

<section class="screen screen-wide" id="screen-board" hidden>
  <div id="self-badge" class="self-badge">
    <strong id="self-role"></strong>
    <span id="self-party"></span>
  </div>

  <div class="game">
    <div class="game-main">
      <div id="seats"></div>

      <div class="board">
        <h3 id="track-a-title" class="track-title"></h3>
        <div id="track-a" class="track" data-team="a"></div>
        <h3 id="track-b-title" class="track-title"></h3>
        <div id="track-b" class="track" data-team="b"></div>
        <p id="legend-leader" class="hint"></p>
        <p id="legend-veto" class="hint"></p>
        <div class="tracker">
          <span data-i18n="board.tracker"></span>
          <span id="tracker-dots"></span>
        </div>
      </div>
    </div>

    <aside class="game-side">
      <div id="action" class="action-panel"></div>
      <div id="last-vote" class="last-vote"></div>
    </aside>
  </div>
</section>


  </main>

  <footer class="credits" data-i18n="footer.credit"></footer>
  
  <button id="btn-mute" class="mute-btn"></button>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
      <div class="action-row">
        <button id="modal-cancel" class="btn btn-secondary"></button>
        <button id="modal-ok" class="btn"></button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
